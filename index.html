const DMAP = Object.fromEntries(DISHES.map(d=>[d.id,d]));
const GOOD_TAGS=['味道好','分量足','性价比高','出餐快'];
const BAD_TAGS=['排队久','分量少','太油','太咸','不新鲜','价格虚高'];

/* ================= 本地存储（网页版与小程序版共享） ================= */
const LS={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const myReviews=()=>LS.get('cr_reviews',[]);
const myWants=()=>LS.get('cr_wants',[]);

/* ================= 计算 ================= */
function reviewsOf(d){return myReviews().filter(r=>r.dish===d.id).concat(d.seed)}
function dishStat(d){const u=myReviews().filter(r=>r.dish===d.id);const n=d.cnt+u.length;return{avg:(d.rate*d.cnt+u.reduce((s,r)=>s+r.rate,0))/n,n}}
function winDishes(w){return DISHES.filter(d=>d.w===w.id)}
function winStat(w){let s=0,n=0;winDishes(w).forEach(d=>{const t=dishStat(d);s+=t.avg*t.n;n+=t.n});return{avg:s/n,n}}
function winReasons(w){const m={};(w.warn||[]).forEach(t=>m[t]=(m[t]||0)+3);winDishes(w).forEach(d=>reviewsOf(d).forEach(r=>r.tags.filter(t=>BAD_TAGS.includes(t)).forEach(t=>m[t]=(m[t]||0)+1)));return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>e[0])}
const isBadWin=w=>winStat(w).avg<3.3;
function nowMeal(){const h=new Date().getHours();return h<10?'早':h<15?'午':'晚'}
function crowd(c){const t=new Date().getHours()+new Date().getMinutes()/60;const g=(m,s)=>Math.exp(-((t-m)**2)/(2*s*s));const p=Math.max(g(12.1,.8),g(18,.9),.7*g(7.6,.6));return Math.min(.98,Math.max(.12,c.pop*(.25+.8*p)))}
function crowdTxt(p){return p>.66?['拥挤','var(--bad)']:p>.38?['适中','var(--warn)']:['空闲','var(--good)']}
function queue(w){return Math.max(1,Math.round(w.q*(.35+crowd(CANTEENS[w.c]))))}
const rnd=x=>{const s=Math.sin(x*99.13)*43758.5453;return s-Math.floor(s)};
const rc=v=>v>=4.2?'g':v>=3.3?'m':'b';
const stars=v=>{const n=Math.round(v);return '<span class="stars">'+'★'.repeat(n)+'<i>'+'★'.repeat(5-n)+'</i></span>'};

/* ================= 状态 ================= */
const S={meal:nowMeal(),budget:0,taste:'',noQueue:false,seed:1,rank:'red',draft:{rate:0,tags:[]}};
function candidates(){
  let l=DISHES.filter(d=>d.meals.includes(S.meal)&&(!S.budget||d.price<=S.budget)&&(!S.taste||d.tags.includes(S.taste))&&!isBadWin(WIN[d.w]));
  if(S.noQueue){const f=l.filter(d=>queue(WIN[d.w])<=5);if(f.length)l=f}
  return l;
}
function recommend(){
  return candidates().map(d=>{const q=queue(WIN[d.w]);return{d,q,s:dishStat(d).avg*20-(S.noQueue?q*3:q*.6)+(d.newDays?4:0)+rnd(d.id+S.seed*7.3)*16}}).sort((a,b)=>b.s-a.s).slice(0,3);
}
function whyText(d,q){const st=dishStat(d),w=WIN[d.w],c=CANTEENS[w.c];const a=[];
  a.push(st.avg>=4.5?`口碑很稳，${st.n} 人评出 ${st.avg.toFixed(1)} 分`:`${st.n} 人评价 ${st.avg.toFixed(1)} 分`);
  a.push(q<=4?`现在几乎不用排队（约 ${q} 分钟）`:`当前排队约 ${q} 分钟`);
  if(S.budget)a.push(`在你 ${S.budget} 元预算内`);
  if(d.newDays)a.push(`上新第 ${d.newDays} 天，早鸟评价不错`);
  const top=reviewsOf(d)[0];if(top&&top.rate>=4)a.push(`同学说「${top.text.slice(0,16)}…」`);
  return a.slice(0,3).join('；');
}

function dishCard(d,o={}){const st=dishStat(d),w=WIN[d.w],c=CANTEENS[w.c],q=queue(w);
  return `<a class="card dish" href="#/dish/${d.id}">${o.rank?`<div class="rk ${o.rank<=3?'t':''}">${o.rank}</div>`:''}
  <div class="tile">${pic(d)}</div><div class="bd">
  <h3>${d.name} ${d.newDays?'<span class="tag new">新品</span>':''}${isBadWin(w)?'<span class="tag bad">避雷窗口</span>':''}</h3>
  <div class="meta">${c.name} · ${w.name} · ${w.floor}</div>
  <div class="row" style="margin-top:4px"><span class="price"><small>¥</small>${d.price}</span><span class="rate ${rc(st.avg)}">★ ${st.avg.toFixed(1)}</span><span class="meta">${st.n} 评 · 排队 ${q} 分钟</span></div>
  </div></a>`}
function chips(key,opts){return `<div class="chips">${opts.map(([v,t])=>`<button class="chip ${S[key]===v?'on':''}" data-act="set" data-k="${key}" data-v="${v}">${t}</button>`).join('')}</div>`}

   </div>
  </div>
  <div class="card"><h3>同学评价（${rs.length} 条精选）</h3>${rs.map(r=>`<div class="rv"><div class="u"><span>${r.mine?'🙋 我':'👤 '+r.user}</span><span>${r.time}</span></div><div>${stars(r.rate)} ${r.tags.map(t=>`<span class="tag ${BAD_TAGS.includes(t)?'bad':''}">${t}</span>`).join(' ')}</div><div style="margin-top:4px">${esc(r.text)}</div></div>`).join('')}</div>
  </div>`};

V.me=()=>{const rv=myReviews(),ws=myWants().map(i=>DMAP[i]).filter(Boolean);
  return `<div class="card me"><div class="ava">🧑‍🎓</div><div><h2>同学你好</h2><div class="meta">已写 ${rv.length} 条评价 · 想吃 ${ws.length} 道菜</div></div></div>
  <section class="sec"><div class="sech"><h2>想吃清单</h2></div>${ws.length?`<div class="grid">${ws.map(d=>dishCard(d)).join('')}</div>`:'<div class="card empty">还没有想吃的菜，去<a href="#/" style="color:var(--brand-d)">首页</a>逛逛</div>'}</section>
  <section class="sec"><div class="sech"><h2>我的评价</h2>${rv.length?'<button data-act="clear">清空演示数据</button>':''}</div>${rv.length?`<div class="card">${rv.map(r=>`<a class="rv" style="display:block" href="#/dish/${r.dish}"><div class="u"><span>${DMAP[r.dish]?.name||''}</span><span>${r.time}</span></div><div>${stars(r.rate)} ${r.tags.map(t=>`<span class="tag">${t}</span>`).join(' ')}</div><div>${esc(r.text)}</div></a>`).join('')}</div>`:'<div class="card empty">吃过的菜评一句，榜单会实时变化</div>'}</section>
  <section class="sec"><a class="card" style="display:block" href="#/about"><b>📐 产品设计思路</b><div class="meta">痛点、功能取舍与后续规划 ›</div></a></section>`};

V.about=()=>`<div class="card about">
  <h2>一、要解决的问题</h2>
  <p>大学生每天两到三次面对「食堂吃什么」。信息其实都在同学嘴里，但没有沉淀下来，于是：</p>
  <ul><li><b>决策成本高</b>：站在食堂门口转两圈，最后还是吃老三样。</li><li><b>踩雷靠运气</b>：哪个窗口手抖、哪个窗口菜是凉的，只能自己踩过才知道。</li><li><b>新菜没人知道</b>：窗口上了新品，没有渠道触达，也没人敢第一个吃。</li><li><b>排队不可见</b>：走到了才发现要排 15 分钟，下午还有课。</li></ul>
  <h2>二、核心设计判断</h2>
  <table><tr><th>判断</th><th>对应设计</th></tr>
  <tr><td>学生要的是「答案」而不是「列表」</td><td>首页直接给 3 个推荐并写明理由，而不是先让人逛榜单；再加一个「帮我选一个」兜底。</td></tr>
  <tr><td>食堂的最小决策单位是「窗口」而不是「餐厅」</td><td>数据结构为 食堂 → 窗口 → 菜品，避雷以窗口为粒度（同一食堂好坏窗口并存）。</td></tr>
  <tr><td>避雷信息必须给出原因</td><td>黑榜不只给低分，还聚合差评标签（分量少、太油、不新鲜……）和近期趋势。</td></tr>
  <tr><td>新品冷启动缺评价</td><td>独立的尝鲜榜，评价少的新菜标「求测评」，引导第一批反馈。</td></tr>
  <tr><td>评价要 10 秒内写完</td><td>星级 + 一键标签为主，文字可选；发布后榜单与评分立即变化。</td></tr>
  <tr><td>场景在路上、在排队时</td><td>同时提供小程序形态，网页版内可用 iPhone 真机直接体验。</td></tr></table>
  <h2>三、功能结构</h2>
  <ul><li><b>推荐</b>：按餐段、预算、口味、是否愿意排队筛选，黑榜窗口自动排除。</li><li><b>红黑榜</b>：红榜看必吃菜，黑榜看避雷窗口及原因。</li><li><b>新品</b>：本周上新 + 尝鲜人数 + 早鸟口碑。</li><li><b>食堂</b>：实时拥挤度、窗口口碑排序、菜品详情与评价。</li><li><b>我的</b>：想吃清单、我的评价。</li></ul>
  <h2>四、推荐逻辑（当前版本）</h2>
  <p>得分 = 菜品评分 × 权重 − 排队时间惩罚（勾选「不想排队」后加重）＋ 新品加成 ＋ 少量随机扰动（用于「换一批」）。命中黑榜窗口的菜直接过滤。每条推荐都把依据写成一句人话，让推荐可解释。</p>
  <h2>五、后续规划</h2>
  <ul><li>接入校园卡消费流水，用真实客流替代估算的排队时间。</li><li>评价带图、「今日实拍」，解决菜品图与实物不符。</li><li>AI 一句话点餐（「15 块以内、想吃辣、不排队」）与评价自动摘要。</li><li>食堂经营方后台：差评原因看板，形成反馈闭环。</li><li>防刷机制：校园身份认证 + 消费后才可评价。</li></ul>
  <h2>六、关于这个演示</h2>
  <p>当前为产品雏形，菜品与评价是模拟数据；你写的评价保存在本机浏览器，网页版与小程序版共享。全程使用 AI Coding 工具（Claude Code）完成设计、开发与部署。菜品照片来自 Wikimedia Commons 的自由许可图片，仅作示意，<a href="credits.html" style="color:var(--brand-d)">查看图片来源</a>。</p>
</div>`;

/* ================= 路由与渲染 ================= */
const TABS=[['','推荐','🍚'],['rank','红黑榜','🏆'],['new','新品','✨'],['canteens','食堂','🏫'],['me','我的','🧑‍🎓']];
const TITLES={'':'食堂吃什么',rank:'红黑榜',new:'本周新品',canteens:'食堂',me:'我的',about:'设计思路',canteen:'食堂详情',win:'窗口详情',dish:'菜品详情'};
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function route(){const p=location.hash.replace(/^#\/?/,'').split('/');return{name:p[0]||'',id:+p[1]||0}}
let lastRoute='';
function render(keepScroll){
  const r=route();const key=r.name+'/'+r.id;
  if(key!==lastRoute){S.draft={rate:0,tags:[]}}
  const fn={'':V.home,rank:V.rank,new:V.new,canteens:V.canteens,canteen:V.canteen,win:V.win,dish:V.dish,me:V.me,about:V.about}[r.name]||V.home;
  const y=window.scrollY;
  document.getElementById('app').innerHTML=fn(r.id);
  const tabOf={canteen:'canteens',win:'canteens',dish:'',about:'me'}[r.name]??r.name;
  document.getElementById('wnav').innerHTML=TABS.map(t=>`<a href="#/${t[0]}" class="${tabOf===t[0]&&r.name!=='about'?'on':''}">${t[1]}</a>`).join('')+`<a href="#/about" class="${r.name==='about'?'on':''}">设计思路</a>`;
  document.getElementById('tabbar').innerHTML=TABS.map(t=>`<a href="#/${t[0]}" class="${tabOf===t[0]?'on':''}"><b>${t[2]}</b>${t[1]}</a>`).join('');
  document.getElementById('mptitle').textContent=TITLES[r.name]||'食堂吃什么';
  document.getElementById('mpback').style.display=TABS.some(t=>t[0]===r.name)?'none':'';
  window.scrollTo(0,keepScroll&&key===lastRoute?y:0);
  lastRoute=key;
}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}

function lucky(){
  const list=candidates();if(!list.length){toast('当前条件下没有可选的菜');return}
  const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="box"><div class="em" id="lem">🎲</div><h3 id="lname">正在帮你选…</h3><div class="meta" id="lmeta">&nbsp;</div><div id="lbtn" style="margin-top:16px"></div></div>';
  document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m||e.target.closest('[data-x]'))m.remove()});
  let i=0;const pickD=list[Math.floor(Math.random()*list.length)];
  const tm=setInterval(()=>{const d=i<14?list[Math.floor(Math.random()*list.length)]:pickD;m.querySelector('#lem').innerHTML=pic(d);m.querySelector('#lname').textContent=d.name;
    if(++i>14){clearInterval(tm);const w=WIN[d.w];m.querySelector('#lmeta').textContent=`${CANTEENS[w.c].name} · ${w.name} · ¥${d.price} · ★${dishStat(d).avg.toFixed(1)}`;
      m.querySelector('#lbtn').innerHTML=`<a class="btn block" data-x href="#/dish/${d.id}">就吃这个</a><button class="btn ghost block" style="margin-top:8px" data-x data-act="lucky">再选一次</button>`}},90);
}

/* ---------- iPhone 真机演示 ---------- */
function fitPhone(){const s=Math.min(1,(innerHeight-24)/868,(innerWidth-16)/414);const w=document.getElementById('phoneWrap');w.style.transform=`scale(${s})`}
function openPhone(){const slot=document.getElementById('phoneSlot');slot.innerHTML='<iframe title="小程序版演示" src="'+location.pathname+'?mp=1&v=4#/"></iframe>';fitPhone();document.getElementById('phoneMask').classList.add('show');document.body.style.overflow='hidden'}
function closePhone(){document.getElementById('phoneMask').classList.remove('show');document.getElementById('phoneSlot').innerHTML='';document.body.style.overflow='';render(true)}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,v=el.dataset.v;
  if(a==='set'){const k=el.dataset.k;S[k]=k==='budget'?+v:v;render(true)}
  else if(a==='toggleQ'){S.noQueue=!S.noQueue;render(true)}
  else if(a==='shuffle'){S.seed++;render(true);toast('已换一批')}
  else if(a==='lucky'){lucky()}
  else if(a==='back'){history.length>1?history.back():location.hash='#/'}
  else if(a==='phone'){openPhone()}
  else if(a==='phoneClose'){closePhone()}
  else if(a==='star'){S.draft.rate=+v;document.querySelectorAll('#pick span').forEach(s=>s.classList.toggle('on',+s.dataset.v<=S.draft.rate))}
  else if(a==='rtag'){const i=S.draft.tags.indexOf(v);i<0?S.draft.tags.push(v):S.draft.tags.splice(i,1);el.classList.toggle('on')}
  else if(a==='want'){const id=+el.dataset.id,w=myWants(),i=w.indexOf(id);i<0?w.push(id):w.splice(i,1);LS.set('cr_wants',w);render(true);toast(i<0?'已加入想吃清单':'已移出想吃清单')}
  else if(a==='submit'){
    if(!S.draft.rate){toast('先点星星打个分吧');return}
    const text=document.getElementById('rtext').value.trim()||(S.draft.rate>=4?'好吃，推荐':S.draft.rate<=2?'踩雷了，不推荐':'一般般');
    const rv=myReviews();rv.unshift({dish:+el.dataset.id,rate:S.draft.rate,tags:S.draft.tags.slice(),text,time:'刚刚',mine:true,user:'我'});LS.set('cr_reviews',rv);
    S.draft={rate:0,tags:[]};render(true);toast('评价已发布，评分和榜单已更新')}
  else if(a==='clear'){LS.set('cr_reviews',[]);LS.set('cr_wants',[]);render();toast('已清空')}
});
window.addEventListener('hashchange',()=>render());
window.addEventListener('resize',fitPhone);
window.addEventListener('storage',()=>render(true)); // 另一端（网页/小程序）写入后同步
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePhone()});
function tick(){const d=new Date();document.getElementById('clock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}
tick();setInterval(tick,20000);
render();
</script>
</body>
