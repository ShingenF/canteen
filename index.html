<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>食堂吃什么 · 校园食堂点评推荐</title>
<style>
:root{--brand:#ff6633;--brand-d:#f04e1a;--brand-l:#fff0ea;--bg:#f4f4f4;--card:#fff;--ink:#222;--sub:#8a8a8a;--line:#f0f0f0;--good:#12a86b;--bad:#e5484d;--warn:#f59a23;--red:#ff4d3a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
a{color:inherit;text-decoration:none}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit;padding:0}
h1,h2,h3,h4,p{margin:0}
img{display:block}
.or{color:var(--brand-d)}.red{color:var(--bad)}

/* ---------- web chrome ---------- */
.webbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid #e9e9e9}
.webbar .in{max-width:1120px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;gap:18px}
.logo{font-weight:800;font-size:19px;white-space:nowrap}.logo span{color:var(--brand)}
.wnav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}.wnav::-webkit-scrollbar{display:none}
.wnav a{padding:8px 13px;border-radius:999px;color:#666;white-space:nowrap;font-weight:500;font-size:15px}
.wnav a.on{background:var(--brand-l);color:var(--brand-d);font-weight:700}
.mpbtn{background:#222;color:#fff;padding:9px 16px;border-radius:999px;font-weight:600;white-space:nowrap;font-size:14px}
main{max-width:1120px;margin:0 auto;padding:16px 16px 60px}
.web main.full{padding:0;height:calc(100vh - 61px);position:relative;overflow:hidden;background:#fff}
.mp .webbar{display:none}
.mp{scrollbar-width:none}.mp ::-webkit-scrollbar,.mp::-webkit-scrollbar{display:none}

/* ---------- mini program chrome ---------- */
.mpstatus,.mpnav,.tabbar{display:none}
.mp body{overflow-x:hidden}
.mp .mpstatus{display:flex;position:fixed;top:0;left:0;right:0;height:50px;z-index:30;background:#fff;align-items:flex-end;justify-content:space-between;padding:0 30px 6px;font-weight:600;font-size:15px}
.mp .mpnav{display:flex;position:fixed;top:50px;left:0;right:0;height:44px;z-index:30;background:#fff;align-items:center;justify-content:center;font-weight:600;font-size:16px}
.mpnav.home{justify-content:flex-start;padding-left:14px}
.locn{font-size:16px;font-weight:700}.locn i{font-style:normal;font-size:11px;color:#999}
.mpnav .back{position:absolute;left:8px;font-size:28px;width:36px;height:36px;line-height:30px}
.capsule{position:absolute;right:10px;top:6px;height:32px;width:87px;border:1px solid #e6e6e6;border-radius:16px;display:flex;align-items:center;justify-content:space-around;font-size:15px;background:rgba(255,255,255,.8)}
.capsule i{width:1px;height:18px;background:#e3e3e3}
.mp main{padding:100px 10px 92px}
.mp main.full{position:fixed;top:94px;bottom:78px;left:0;right:0;padding:0;overflow:hidden;background:#fff}
.mp .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;height:78px;z-index:30;background:#fff;border-top:1px solid #ececec;padding-top:7px}
.tabbar a{flex:1;text-align:center;font-size:10.5px;color:#999}
.tabbar svg{display:block;width:24px;height:24px;margin:0 auto 2px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar a.on{color:var(--brand-d);font-weight:600}.tabbar a.on svg{stroke-width:2.2}

/* ---------- cards & modules ---------- */
.card{background:var(--card);border-radius:12px;margin-bottom:10px;overflow:hidden}
.mod{padding:12px}
.modh{display:flex;align-items:baseline;gap:8px;margin-bottom:10px}
.modh h2{font-size:17px;font-weight:800;white-space:nowrap}
.modh .sub{flex:1;font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnk{font-size:12.5px;color:var(--sub);white-space:nowrap}
.empty{text-align:center;color:var(--sub);padding:26px 0;font-size:13px}
.search{display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--brand);border-radius:999px;padding:8px 14px;color:#aaa;font-size:13.5px;margin-bottom:10px}
.search input{flex:1;border:0;outline:0;font:inherit;color:var(--ink);background:none;min-width:0}
.demo{display:flex;width:100%;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#2b2420,#4a3a31);color:#fff;border-radius:12px;padding:14px 18px;margin-bottom:10px;font-size:15px}
.demo span{opacity:.75;font-size:13px}
.king{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 0;padding:14px 4px 12px}
.king button{font-size:12px;color:#444;text-align:center}
.king i{display:grid;place-items:center;width:44px;height:44px;margin:0 auto 5px;border-radius:15px;font-style:normal;font-size:23px;background:#fff4ed}
.king button:nth-child(3n+2) i{background:#eef6ff}.king button:nth-child(3n) i{background:#effaf1}
@media(min-width:760px){.web .king{grid-template-columns:repeat(10,1fr)}}

/* filter bar (compact) */
.fbar{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin-bottom:4px}.fbar::-webkit-scrollbar{display:none}
.pill{flex:none;padding:5px 11px;border-radius:6px;background:#f5f5f5;font-size:12.5px;color:#555;white-space:nowrap}
.pill i{font-style:normal;font-size:10px;margin-left:3px;color:#aaa}
.pill.on{background:var(--brand-l);color:var(--brand-d);font-weight:600}.pill.on i{color:var(--brand)}

/* dish row */
.rows{display:grid;grid-template-columns:minmax(0,1fr)}
@media(min-width:760px){.web .rows{grid-template-columns:repeat(3,minmax(0,1fr));gap:0 18px}.web .rows.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.drow{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);position:relative}
.rows .drow:last-child,.mlist .drow:last-child{border-bottom:0}
.drow .ph{width:92px;height:92px;border-radius:8px;overflow:hidden;flex:none;position:relative;background:#eee}
.ph img,.nph img,.bph img,.fimg img,.bigph img,.wph img,.modal .em img{width:100%;height:100%;object-fit:cover}
.cb{position:absolute;left:0;top:0;font-size:10.5px;font-weight:700;color:#fff;padding:1px 6px;border-radius:8px 0 8px 0;background:var(--brand)}
.cb.new,.cb.good{background:var(--good)}.cb.bad{background:var(--bad)}
.rkb{position:absolute;left:0;top:0;min-width:20px;text-align:center;font-size:12px;font-weight:800;color:#fff;padding:1px 5px;border-radius:8px 0 8px 0;background:#b9b9b9}
.rkb.t{background:linear-gradient(135deg,#ff8a3d,#ff4d3a)}
.drow .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.drow h3{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2{display:flex;gap:8px;font-size:12px;color:#666;white-space:nowrap;overflow:hidden}
.sc{color:var(--brand-d);font-weight:800}.sc.m{color:var(--warn)}.sc.b{color:var(--bad)}.sc.g{color:var(--brand-d)}
.qok{color:var(--good)}
.l3{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{display:flex;gap:4px;flex-wrap:wrap;overflow:hidden;max-height:19px}
.tg em,.tgi{font-style:normal;font-size:10.5px;padding:0 5px;border-radius:3px;border:1px solid #e3e3e3;color:#888;line-height:16px;white-space:nowrap}
.tg em.o{border-color:#ffd2c0;color:var(--brand-d);background:#fff7f3}.tg em.r,.tgi.r{border-color:#f8c9cb;color:var(--bad);background:#fff5f5}.tg em.g{border-color:#bfe8d4;color:var(--good);background:#f1fbf6}
.why{font-size:11.5px;color:#8a6d4b;background:#fff8ee;border-radius:4px;padding:2px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{display:flex;align-items:center;justify-content:space-between;margin-top:auto}
.price{color:var(--red);font-weight:800;font-size:17px}.price small{font-size:11px;font-weight:700}
.price.big{font-size:26px}
.plus{width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:18px;line-height:22px;font-weight:600;text-align:center}
.plus.on{background:#fff;color:var(--brand);box-shadow:inset 0 0 0 1.5px var(--brand);font-size:13px}
.drow.isbad .ph img{filter:grayscale(.55)}
.lucky{display:block;width:100%;margin-top:10px;padding:10px;border-radius:8px;background:var(--brand-l);color:var(--brand-d);font-weight:700;font-size:14px}

/* 避雷 */
.badmod{background:linear-gradient(180deg,#fff1f0 0,#fff 70px)}
.badmod .modh h2{color:#d93025}
.bads{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:760px){.web .bads{grid-template-columns:repeat(2,minmax(0,1fr))}}
.badw{display:flex;gap:10px;background:#fff;border:1px solid #f9dcdc;border-radius:10px;padding:8px}
.bph{display:flex;gap:4px;flex:none}
.bph div{width:70px;height:92px;border-radius:6px;overflow:hidden;position:relative}
.bph span{position:absolute;left:0;right:0;bottom:0;font-size:10px;color:#fff;padding:10px 4px 2px;background:linear-gradient(transparent,rgba(0,0,0,.72));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.binfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.binfo h3{font-size:14.5px;display:flex;justify-content:space-between;gap:6px;white-space:nowrap}.binfo h3 b{color:var(--bad)}
.quote{font-size:12px;color:#666;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.trend{font-size:11.5px;color:var(--bad)}

/* 新品横滑 */
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}.hscroll::-webkit-scrollbar{display:none}
.newc{flex:none;width:118px}
.nph{height:118px;border-radius:8px;overflow:hidden;position:relative;margin-bottom:5px;background:#eee}
.newc h3{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.newc .price{font-size:15px}
.newc.sm{width:96px}.newc.sm .nph{height:96px}
.nearby{display:flex;align-items:center;gap:10px;padding:12px}
.nearby div{flex:1}.nearby p{font-size:12px;color:var(--sub)}
.dot{width:10px;height:10px;border-radius:50%;flex:none}

/* 信息流 */
.ftabs{display:flex;gap:18px;padding:8px 4px 10px;position:sticky;z-index:5;background:var(--bg)}
.web .ftabs{top:61px}.mp .ftabs{top:94px}
.ftabs button{font-size:15px;color:#777;position:relative;padding-bottom:5px}
.ftabs button.on{color:var(--ink);font-weight:800;font-size:16px}
.ftabs button.on:after{content:"";position:absolute;left:25%;right:25%;bottom:0;height:3px;border-radius:2px;background:var(--brand)}
.feed{columns:2;column-gap:8px}
@media(min-width:760px){.web .feed{columns:4;column-gap:12px}}
.fc{display:block;break-inside:avoid;background:#fff;border-radius:10px;overflow:hidden;margin-bottom:8px}
.fimg{position:relative;aspect-ratio:1/1;background:#eee}.fimg.tall{aspect-ratio:3/4}
.fimg .loc{position:absolute;left:6px;bottom:6px;right:6px;font-size:10.5px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1}
.fimg:after{content:"";position:absolute;left:0;right:0;bottom:0;height:36px;background:linear-gradient(transparent,rgba(0,0,0,.35));pointer-events:none}
.fb{padding:8px}
.fb h4{font-size:13.5px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fs{display:flex;justify-content:space-between;align-items:center;margin-top:4px}.fs .price{font-size:13px}
.stars{color:#ff8a1f;letter-spacing:.5px;font-size:12px}.stars i{color:#ddd;font-style:normal}
.fu{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:11.5px;color:#888}
.fu span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ava{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;color:#fff;font-size:10px;font-style:normal;flex:none}
.like{font-size:12px;color:#999}.like.on{color:var(--red)}

/* 找菜 */
.menu{height:100%;display:flex;flex-direction:column}
.dims{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;flex:none}
.dims button{padding:6px 14px;border-radius:999px;font-size:14px;color:#555;white-space:nowrap}
.dims button.on{background:var(--brand);color:#fff;font-weight:700}
.mbody{flex:1;display:flex;min-height:0}
.side{width:86px;flex:none;background:#f6f6f6;overflow-y:auto}
.side button{display:block;width:100%;padding:15px 6px;font-size:13.5px;color:#666;text-align:center;position:relative}
.side small{display:block;font-size:10.5px;color:#aaa}
.side button.on{background:#fff;color:var(--ink);font-weight:800}
.side button.on:before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3.5px;border-radius:0 3px 3px 0;background:var(--brand)}
.mlist{flex:1;min-width:0;overflow-y:auto;padding:0 10px 10px}
.mh{font-size:12px;color:var(--sub);padding:10px 0 2px;position:sticky;top:0;background:#fff;z-index:2}.mh b{color:var(--ink);font-size:14px}
.mh.warn{color:var(--bad);margin-top:6px}
.menu .drow .ph{width:80px;height:80px}
.cartbar{flex:none;display:flex;align-items:center;gap:10px;margin:0 10px 8px;height:46px;border-radius:23px;background:#2b2b2b;color:#fff;padding:0 4px 0 14px}
.cart{position:relative;font-size:22px}.cart b{position:absolute;right:-8px;top:-4px;min-width:16px;height:16px;border-radius:8px;background:var(--red);font-size:10.5px;text-align:center;line-height:16px}
.ct{flex:1;font-size:13.5px}
.cartbar .go{background:var(--brand);height:38px;line-height:38px;padding:0 16px;border-radius:19px;font-weight:700;font-size:14px}
.cartbar.empty0 .ct{color:#aaa;font-size:12.5px}.cartbar.empty0 .go{background:#555}
@media(min-width:760px){.web .menu{max-width:1120px;margin:0 auto}.web .side{width:130px}.web .mlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px;align-content:start}.web .mh{grid-column:1/-1}}

/* 地图 */
.mapwrap{position:absolute;inset:0;overflow:hidden;background:#eef2e4}
.mapsvg{position:absolute;inset:0;width:100%;height:100%}
.pin{cursor:pointer}.pin .pg{transition:transform .2s;transform-origin:0 0}.pin.sel .pg{transform:scale(1.18)}
.legend{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.94);border-radius:8px;padding:5px 9px;font-size:11px;color:#666;display:flex;gap:9px;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px}
.drawer{position:absolute;left:0;right:0;top:0;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.14);will-change:transform}
@media(min-width:760px){.web .drawer{left:50%;right:auto;width:460px;margin-left:-230px}}
.dhead{padding:20px 14px 10px;touch-action:none;cursor:grab;position:relative;user-select:none}
.grip{position:absolute;top:8px;left:50%;width:36px;height:4.5px;margin-left:-18px;border-radius:3px;background:#d8d8d8}
.dhead h2{font-size:19px;font-weight:800}.dhead p{font-size:12.5px;color:var(--sub);margin-top:2px}
.dh1{display:flex;align-items:center;gap:8px}.dh1 em{font-style:normal;font-size:12px;font-weight:700;padding:1px 8px;border-radius:4px}
.dh1 .x{margin-left:auto;width:28px;height:28px;border-radius:50%;background:#f2f2f2;font-size:18px;color:#888;line-height:26px}
.dbody{overflow-y:auto;padding:0 14px 20px}
.dbody h4{font-size:15px;margin:16px 0 8px}.dbody h4 small{font-weight:400;color:var(--sub);font-size:12px}
.dstat{display:grid;grid-template-columns:repeat(4,1fr);background:#fafafa;border-radius:10px;padding:10px 0;text-align:center}
.dstat b{display:block;font-size:18px}.dstat small{font-size:10.5px;font-weight:500}.dstat span{font-size:11.5px;color:var(--sub)}
.ddesc{font-size:13px;color:#555;margin-top:10px}
.dwarn{margin-top:10px;background:#fff3f2;border:1px solid #f9dcdc;border-radius:8px;padding:8px 10px;font-size:12.5px;color:#b3261e}
.cl{display:flex;width:100%;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);text-align:left}
.cl div{flex:1}.cl b{font-size:15px}.cl p{font-size:12px;color:var(--sub)}.cl em{font-style:normal;font-weight:700;font-size:13px}
.wl{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.wph{width:64px;height:64px;border-radius:8px;overflow:hidden;flex:none}
.wl .bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.wl h3{font-size:15px;display:flex;align-items:center;gap:6px}.wl h3 b{margin-left:auto;font-size:16px}
.wl h3 em{font-style:normal;font-size:10.5px;padding:0 5px;border-radius:3px;border:1px solid #f8c9cb;color:var(--bad);font-weight:500}
.wl.isbad .wph img{filter:grayscale(.55)}

/* 其他页面 */
.tabs{display:flex;background:#e9e9e9;border-radius:10px;padding:3px;margin-bottom:10px}
.tabs button{flex:1;padding:8px;border-radius:8px;font-weight:600;color:#888}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.crumb{font-size:13px;color:var(--sub);margin-bottom:10px}.crumb a{color:var(--brand-d)}
.mp .crumb{display:none}
.detail{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
@media(min-width:860px){.web .detail{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:start}}
.bigph{height:230px;background:#eee}.pad{padding:12px}
.dtitle{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dtitle h1{font-size:21px}
.big{font-size:28px;font-weight:800;color:var(--brand-d)}.big.m{color:var(--warn)}.big.b{color:var(--bad)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;text-align:center}
.stat3 div{background:#fafafa;border-radius:10px;padding:9px 4px}
.stat3 b{display:block;font-size:18px}.stat3 span{font-size:11.5px;color:var(--sub)}
.btn{background:var(--brand);color:#fff;font-weight:700;padding:11px 18px;border-radius:999px;font-size:15px}
.btn.ghost{background:var(--brand-l);color:var(--brand-d)}
.btn.block{display:block;width:100%;text-align:center}
.pick{display:flex;gap:6px;font-size:32px;color:#ddd;cursor:pointer;user-select:none}
.pick span.on{color:#ff8a1f}
.rtags{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.rtags .pill{padding:6px 12px;border-radius:999px}
textarea{width:100%;border:1px solid #e8e8e8;border-radius:10px;padding:10px;font:inherit;resize:vertical;min-height:72px;background:#fafafa;margin:10px 0}
textarea:focus{outline:2px solid var(--brand-l);border-color:var(--brand)}
.rv{display:block;padding:11px 0;border-top:1px solid var(--line)}.modh+.rv{border-top:0}
.rv .u{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);margin-bottom:3px}.rv .u b{color:#444;flex:1}
.rv p{margin-top:3px;font-size:14px}
.me{display:flex;align-items:center;gap:14px;padding:16px}
.avab{width:56px;height:56px;border-radius:50%;background:var(--brand-l);display:grid;place-items:center;font-size:28px}
.about{padding:16px}
.about h2{font-size:17px;margin:20px 0 8px}.about h2:first-child{margin-top:0}
.about p,.about li{color:#444;font-size:14px;line-height:1.65}.about ul{padding-left:20px;margin:6px 0}
.about table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
.about td,.about th{border:1px solid #eee;padding:8px;text-align:left;vertical-align:top}.about th{background:#fafafa}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(30,30,30,.9);color:#fff;padding:9px 18px;border-radius:999px;font-size:13.5px;z-index:99;opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:grid;place-items:center;padding:20px}
.modal .box{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:320px;text-align:center}
.modal .em{height:180px;border-radius:12px;overflow:hidden;background:#f3f3f3;margin-bottom:10px}
.modal h3{font-size:19px;margin:4px 0}
.modal.sheet{place-items:end center;padding:0}
.modal.sheet .box{max-width:520px;border-radius:16px 16px 0 0;padding:16px 14px 30px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(100%)}}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.opts button{padding:11px 4px;border-radius:8px;background:#f5f5f5;font-size:14px}
.opts button.on{background:var(--brand-l);color:var(--brand-d);font-weight:700;box-shadow:inset 0 0 0 1px var(--brand)}
.cancel{width:100%;padding:11px;color:#888}

/* ---------- phone overlay ---------- */
#phoneMask{position:fixed;inset:0;z-index:100;background:rgba(20,16,14,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;overflow:hidden}
#phoneMask.show{display:flex}
.phoneWrap{display:flex;align-items:center;gap:40px}
.phone{width:414px;height:868px;border-radius:60px;background:#111;padding:12px;position:relative;flex:none;box-shadow:0 0 0 2px #3a3a3c,0 30px 80px rgba(0,0,0,.6)}
.phone:before{content:"";position:absolute;left:-4px;top:170px;width:3px;height:34px;background:#2a2a2c;border-radius:2px;box-shadow:0 62px 0 #2a2a2c,0 124px 0 #2a2a2c}
.phone:after{content:"";position:absolute;right:-4px;top:230px;width:3px;height:96px;background:#2a2a2c;border-radius:2px}
.phone iframe{width:390px;height:844px;border:0;border-radius:48px;background:#fff;display:block}
.island{position:absolute;top:23px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:2;pointer-events:none}
.homebar{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:2;pointer-events:none}
.phoneSide{color:#fff;max-width:300px}
.phoneSide h2{font-size:24px}.phoneSide p{opacity:.8;margin-top:8px;font-size:14.5px}
.phoneSide ul{padding-left:18px;opacity:.9;font-size:14px;line-height:1.8}
.phoneSide .btn{margin-top:14px}
.xclose{position:absolute;top:16px;right:20px;color:#fff;font-size:30px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.14);z-index:3}
@media(max-width:820px){.phoneSide{display:none}}
</style>
</head>
